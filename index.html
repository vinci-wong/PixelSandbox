<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PixelSandbox</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Pixel Sandbox</h1>
    <canvas
      id="canvas"
      width="480"
      height="480"
    ></canvas>
    <div id="grid"></div>
    <div id="colors">
      <button id="red" class="color">red</button>
      <button id="orange" class="color">
        orange
      </button>
      <button id="yellow" class="color">
        yellow
      </button>
      <button id="lightgreen" class="color">
        light green
      </button>
      <button id="green" class="color">
        green
      </button>
      <button id="lightblue" class="color">
        lightblue
      </button>
      <button id="blue" class="color">
        blue
      </button>
      <button id="pink" class="color">
        pink
      </button>
      <button id="purple" class="color">
        purple
      </button>
      <button id="violet" class="color">
        violet
      </button>
      <button id="tan" class="color">tan</button>
      <button id="brown" class="color">
        brown
      </button>
      <button id="white" class="color">
        white
      </button>
      <button id="gray" class="color">
        gray
      </button>
      <button id="black" class="color">
        black
      </button>
    </div>
    <button id="clear">Clear</button>
    <div id="clear-sure" class="invisible">
      <h1>
        Are you sure you want to clear the canvas?
      </h1>
      <button id="cancel">Cancel</button>
      <button id="ok">OK</button>
    </div>
    <button id="download">&#10515;</button>
    <script src="main.js"></script>
  </body>
</html>
